# Every push and pull request: unit + integration tests (Testcontainers on real MySQL/Kafka/Redis) and ArchUnit
# for every service, then the whole stack in Docker Compose with the end-to-end smoke test.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bankend

jobs:
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - account-service
          - transaction-service
          - fraud-detection-service
          - payment-service
          - notification-service
          - API-GATEWAY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "bankend/**/pom.xml"
      - name: Build and test the shared library
        run: libs/banking-common/mvnw -B -f libs/banking-common/pom.xml install
      - name: Unit, integration (Testcontainers) and ArchUnit tests
        run: ${{ matrix.service }}/mvnw -B -f ${{ matrix.service }}/pom.xml verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: bankend/${{ matrix.service }}/target/surefire-reports/

  e2e:
    name: compose up + smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with throw-away secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          cp .env.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; grep -q "^$1=" .env || echo "$1=$2" >> .env; }
          set_env MYSQL_ROOT_PASSWORD "$(openssl rand -hex 16)"
          set_env JWT_SECRET "$(openssl rand -hex 48)"
          set_env ADMIN_EMAIL "admin@ci.example.com"
          set_env ADMIN_PASSWORD "Ci$(openssl rand -hex 12)1"
          set_env SMTP_MAIL ""            # empty: emails (and OTPs) are logged, the smoke test reads them
          set_env SMTP_PASSWORD ""
          set_env STRIPE_WEBHOOK_SECRET "whsec_$(openssl rand -hex 24)"
          # Optional repository secrets; without them the Stripe check is reported as SKIP
          [ -n "$STRIPE_SECRET_KEY" ] && set_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          [ -n "$STRIPE_PUBLISHABLE_KEY" ] && set_env STRIPE_PUBLISHABLE_KEY "$STRIPE_PUBLISHABLE_KEY"
          true
      - name: Start the stack (builds all images, waits for every healthcheck)
        run: docker compose up -d --build --wait --wait-timeout 900
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color > compose-logs.txt 2>&1 || true
      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: bankend/compose-logs.txt
      - name: Stop the stack
        if: always()
        run: docker compose down -v
