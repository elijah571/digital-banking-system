server:
  port: 8087

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/wallet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # wallet_db is new, so V1 creates the whole schema. There is no older schema to baseline.
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short, so a Redis outage fails the PIN code fast (503), not after a long wait (threat model T13).
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Stripe outcomes from payment-service (wallet-plan 3.8). The values are JSON text, parsed by the listener.
      group-id: wallet-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.MySQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

# PIN secrets (threat model T12 and D-P7). Each must be at least 32 bytes, or the service does not start.
pin:
  pepper: ${PIN_PEPPER:}
  otp-hmac-key: ${PIN_OTP_HMAC_KEY:}

# auth-service, for the password check on a PIN change (wallet-plan 3.5). Calls carry a SERVICE token whose sub is this service.
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8083}
  audience: auth-service

# Card deposits (wallet-plan 3.5, 8.19). CARD_DEPOSIT_MIN is in naira. A deposit that is not paid expires after DEPOSIT_EXPIRY.
wallet:
  deposits:
    card-min: ${CARD_DEPOSIT_MIN:20000}
    expiry: ${DEPOSIT_EXPIRY:PT24H}
  # Our own bank, and the name enquiry (wallet-plan 8.4, 8.10). The bank code and name are required: the service does not start without them.
  own-bank:
    code: ${OWN_BANK_CODE}
    name: ${OWN_BANK_NAME}
  name-enquiry:
    ttl: ${NAME_ENQUIRY_TTL:PT10M}
    rate-limit: ${NAME_ENQUIRY_RATE_LIMIT:20}
  banks:
    cache-ttl: ${BANK_LIST_CACHE_TTL:PT24H}
  # Withdrawal limits, in naira (wallet-plan 8.3, D13). They have no defaults: the service does not start without them.
  withdrawals:
    min: ${WITHDRAWAL_MIN}
    max: ${WITHDRAWAL_MAX}
    daily-max: ${WITHDRAWAL_DAILY_MAX}
    # At or above this amount a payout waits for an admin, even when the fraud check is clean (wallet-plan 8.3). Required.
    approval-threshold: ${WITHDRAWAL_APPROVAL_THRESHOLD}
    # A payout that no admin decides within this time is expired, and its money is released (wallet-plan 8.3). A default of 72 hours.
    approval-expiry: ${WITHDRAWAL_APPROVAL_EXPIRY:PT72H}
    expiry-job:
      enabled: ${WITHDRAWAL_EXPIRY_JOB_ENABLED:true}
      delay-ms: ${WITHDRAWAL_EXPIRY_JOB_DELAY_MS:60000}
  # The flat fee on an outbound payout, in naira, for both kinds of payout (8.3). Zero until the business sets it.
  outbound-fee: ${OUTBOUND_FEE:0.00}
  # Sends the approved payouts, and settles or releases them once the provider answers (wallet-plan 8.3). Every 10 seconds by default.
  payouts:
    process-job:
      enabled: ${PAYOUT_PROCESS_JOB_ENABLED:true}
      delay-ms: ${PAYOUT_PROCESS_JOB_DELAY_MS:10000}

# account-service (owner, status, currency) and payment-service (the card intent). Calls carry a SERVICE token whose sub is this service.
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  audience: account-service
payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  audience: payment-service
fraud-service:
  url: ${FRAUD_SERVICE_URL:http://localhost:8084}
  audience: fraud-detection-service

# Authentication (wallet-plan 3.7). Every route needs a verified token.
auth:
  # Same secret and issuer as auth-service (user tokens, HS256).
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: elibanking-auth

internal-auth:
  # Service tokens (HS256). Minted by the calling service, with iss=elibanking-internal and role=SERVICE.
  jwt-secret: ${INTERNAL_JWT_SECRET:}
  jwt-issuer: elibanking-internal
  audience: wallet-service
  # The sub of the tokens this service mints when it calls another service (wallet-plan 3.7).
  subject: wallet-service
