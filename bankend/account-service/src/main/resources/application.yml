server:
  port: 8081

spring:
  application:
    name: account-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/account_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Databases created by Hibernate before Flyway existed have tables but no history table:
    # mark them as version 1 (= V1__baseline_schema.sql) instead of failing.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.Map

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: "*"

# Authentication (wallet-plan 3.7). There is no legacy header path: every route needs a verified token.
auth:
  # Same secret and issuer as auth-service (user tokens, HS256).
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: elibanking-auth

internal-auth:
  # Service tokens (HS256). Minted by the calling service, with iss=elibanking-internal and role=SERVICE.
  jwt-secret: ${INTERNAL_JWT_SECRET:}
  jwt-issuer: elibanking-internal
  audience: account-service
