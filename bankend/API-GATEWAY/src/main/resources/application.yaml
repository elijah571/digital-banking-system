server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  # Local runs: read JWT_SECRET from the project-root .env (ignored if absent, e.g. in Docker)
  config:
    import: optional:file:../.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms

  cloud:
    gateway:
      server:
        webflux:
          # CORS for browser frontends (comma-separated origins)
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          default-filters:
            # payment-service also adds CORS headers; keep only one copy
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # Auth: register / login / verify / reset (public) + /me, change-password (logged in)
            # Strict per-IP rate limit to slow down password guessing.
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"

            # User management (ADMIN only — enforced in SecurityConfig)
            - id: auth-service-users
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@userKeyResolver}"

            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/accounts,/api/v1/accounts/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            # account-service admin endpoints: ledger reconciliation, admin credit and deduct (ADMIN only, enforced in
            # SecurityConfig). Keep any more specific /api/v1/admin/... route (for example /admin/audit, D7) above this one.
            - id: account-service-admin
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/transactions,/api/v1/transactions/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"

            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/wallet/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"
            - id: wallet-bank-and-name-enquiry
              uri: ${WALLET_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/banks,/api/v1/banks/**,/api/v1/transfers/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - PreserveHostHeader
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@userKeyResolver}"

            # OpenAPI specs of each service, exposed through the gateway for the combined Swagger UI
            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/docs/auth-service/v3/api-docs
              filters:
                - RewritePath=/docs/auth-service/(?<path>.*), /$\{path}
            - id: account-service-docs
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/docs/account-service/v3/api-docs
              filters:
                - RewritePath=/docs/account-service/(?<path>.*), /$\{path}
            - id: transaction-service-docs
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/docs/transaction-service/v3/api-docs
              filters:
                - RewritePath=/docs/transaction-service/(?<path>.*), /$\{path}
            - id: payment-service-docs
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/docs/payment-service/v3/api-docs
              filters:
                - RewritePath=/docs/payment-service/(?<path>.*), /$\{path}

# Shared with auth-service: the gateway validates the JWTs it issues
auth:
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: elibanking-auth

# Combined Swagger UI: http://localhost:8080/swagger-ui.html (service picker in the top-right dropdown)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    urls-primary-name: Auth
    urls:
      - name: Auth
        url: /docs/auth-service/v3/api-docs
      - name: Accounts
        url: /docs/account-service/v3/api-docs
      - name: Transactions
        url: /docs/transaction-service/v3/api-docs
      - name: Payments
        url: /docs/payment-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "*"
