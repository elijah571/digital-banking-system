spring:
  application:
    name: payment-service
  # Local runs: load STRIPE_* secrets from the project-root .env (ignored if absent, e.g. in Docker)
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Databases created by Hibernate before Flyway existed have tables but no history table:
    # mark them as version 1 (= V1__baseline_schema.sql) instead of failing.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.Map

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

server:
  port: 8085

stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: '*'

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

payout:
  provider: ${PAYOUT_PROVIDER:simulator}
  sim:
    default-outcome: ${PAYOUT_SIM_DEFAULT_OUTCOME:success}
    delay-ms: ${PAYOUT_SIM_DELAY_MS:0}
  flutterwave:
    secret-key: ${FLUTTERWAVE_SECRET_KEY:}
    webhook-secret: ${FLUTTERWAVE_WEBHOOK_SECRET:}
    encryption-key: ${FLUTTERWAVE_ENCRYPTION_KEY:}
    base-url: ${FLUTTERWAVE_BASE_URL:https://api.flutterwave.com/v3}

# Verifies the user tokens that auth-service issues (wallet-plan 3.7, D8). The gateway and auth-service share this secret.
auth:
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: elibanking-auth

# Service tokens for calls to account-service (wallet-plan 3.7). The secret is shared with account-service and must be set.
internal-auth:
  # Inbound (the internal API): service tokens minted by wallet-service (wallet-plan 3.7).
  jwt-issuer: elibanking-internal
  # Shared by both directions: the secret that signs and checks service tokens.
  jwt-secret: ${INTERNAL_JWT_SECRET:}
  # Outbound (calls to account-service): the token's sub and aud.
  subject: payment-service
  audience: account-service
  inbound-audience: payment-service
