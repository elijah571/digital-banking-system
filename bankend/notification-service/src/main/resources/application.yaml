server:
  port: 8086

spring:
  application:
    name: notification-service
  # Local runs: read SMTP_* from the project-root .env (ignored if absent, e.g. in Docker)
  config:
    import: optional:file:../.env[.properties]

  # Gmail SMTP. SMTP_PASSWORD must be a Google *App Password* (Google account → Security →
  # 2-Step Verification → App passwords), not your normal Gmail password.
  # Encryption is chosen from the port in MailConfig: 465 = SSL, anything else (587) = STARTTLS.
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_MAIL:}
    password: ${SMTP_PASSWORD:}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # no JPA entities yet; Flyway + validate arrive with notification_db in phase 7
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.Map

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

notification:
  mail:
    from: ${MAIL_FROM:}

internal-auth:
  jwt-secret: ${INTERNAL_JWT_SECRET:}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8083}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
