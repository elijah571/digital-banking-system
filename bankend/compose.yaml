# Full stack:            docker compose up -d --build   (multi-stage builds: no local JDK needed)
# Infrastructure only:   docker compose up -d mysql redis kafka   (then run services with ./mvnw)
# Secrets come from .env (see .env.example).

# Pinned so the project (containers, mysql_data volume) does not depend on the folder name.
name: digital-banking-system

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ACCOUNT_SERVICE_URL: http://account-service:8081

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ---------------- Infrastructure ----------------
  mysql:
    # Pinned to the current MySQL LTS (9.7.4). Keep in sync with libs/banking-common TestImages.
    # Never downgrade: MySQL cannot read a data directory written by a newer server.
    image: mysql:9.7.4
    container_name: mysql
    # Lets Flyway (non-SUPER users) create the ledger's append-only triggers while binary logging is on
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: digital_banking
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_lts97:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - banking-network

  redis:
    image: redis:8.10.2
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"   # set REDIS_HOST_PORT in .env if 6379 is taken on the host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - banking-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT = host machine (localhost:9092), INTERNAL = other containers (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - banking-network

  # Not used by any service yet — start with: docker compose --profile neo4j up -d
  neo4j:
    image: neo4j:2026.10.1   # pinned to the version latest resolved to (was :latest)
    container_name: neo4j
    profiles: ["neo4j"]
    environment:
      - NEO4J_AUTH=neo4j/notverysecret
    ports:
      - "7687:7687"
      - "7474:7474"
    networks:
      - banking-network

  # ---------------- Application services ----------------
  # Every service port is published for testing. In production publish only 8080 (the gateway).
  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    environment:
      <<: *app-env
      # Both are required (compose stops if they are missing). Same JWT_SECRET as auth-service; INTERNAL_JWT_SECRET is for service tokens.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env}
    depends_on: *app-depends
    ports:
      - "8081:8081"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 768m
    networks:
      - banking-network

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    environment:
      <<: *app-env
      # Signs this service's calls to account-service (wallet-plan 3.7). The same value as account-service's.
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env}
    depends_on:
      <<: *app-depends
      account-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 768m
    networks:
      - banking-network

  fraud-detection-service:
    build:
      context: .
      dockerfile: fraud-detection-service/Dockerfile
    environment:
      <<: *app-env
      # Signs this service's calls to account-service (wallet-plan 3.7). The same value as account-service's.
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env}
    depends_on:
      <<: *app-depends
      account-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 512m
    networks:
      - banking-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *app-env
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Signs this service's calls to account-service (wallet-plan 3.7). The same value as account-service's.
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env}
    depends_on:
      <<: *app-depends
      account-service:
        condition: service_healthy
    ports:
      - "8085:8085"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 512m
    networks:
      - banking-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 512m
    networks:
      - banking-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *app-env
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_MAIL: ${SMTP_MAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Dev only: also log verification links / reset tokens so the smoke test can read them
      MAIL_LOG_CONTENT: ${MAIL_LOG_CONTENT:-true}
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 384m
    networks:
      - banking-network

  api-gateway:
    build:
      context: .
      dockerfile: API-GATEWAY/Dockerfile
    environment:
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_SERVICE_URL: http://auth-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure
    # Heap is 75% of this limit (MaxRAMPercentage in the Dockerfile). Same values as compose.prod.yaml.
    mem_limit: 512m
    networks:
      - banking-network

volumes:
  # MySQL 9.7 data lives in its own volume. The old mysql_data volume (MySQL 26.10 data) is kept, not reused:
  # 9.7 cannot read a data directory written by 26.10. Remove mysql_data manually once the new volume is verified.
  mysql_data_lts97:
  mysql_data:

networks:
  banking-network:
    driver: bridge
