spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/transaction_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # Databases created by Hibernate before Flyway existed have tables but no history table:
    # mark them as version 1 (= V1__baseline_schema.sql) instead of failing.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: transaction-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.Map

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

server:
  port: 8082

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

# Verifies the user tokens that auth-service issues (wallet-plan 3.7, D8). The gateway and auth-service share this secret.
auth:
  jwt-secret: ${JWT_SECRET:}
  jwt-issuer: elibanking-auth

# Transfers need the user's PIN while this is true (wallet-plan D2, 8.22). Off until phase 4. The prod profile refuses to start while it is off.
transfer:
  pin-required: ${TRANSFER_PIN_REQUIRED:false}

# Service tokens for calls to account-service (wallet-plan 3.7). The secret is shared with account-service and must be set.
internal-auth:
  jwt-secret: ${INTERNAL_JWT_SECRET:}
  subject: transaction-service
  audience: account-service

# Key for the hash of a transfer OTP (wallet-plan 3c.5 review). Only this service has it, and it must be at least 32 bytes.
otp:
  hmac-key: ${OTP_HMAC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: "*"
